<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>计算之灵 · 骨架预览</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #05060a;
        color: #dde5f0;
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      #stage {
        display: flex;
        align-items: center;
        justify-content: center;
        height: calc(100vh - 64px);
      }
      #canvas-host {
        width: min(100vw, calc((100vh - 64px) * 16 / 9));
        aspect-ratio: 16 / 9;
      }
      #canvas-host canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #hud {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 64px;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 20px;
        background: rgba(10, 12, 18, 0.94);
        border-top: 1px solid #222838;
      }
      #play {
        width: 42px;
        height: 42px;
        flex: 0 0 42px;
        border: 1px solid #38445c;
        border-radius: 50%;
        background: #141a26;
        color: #d8e7ff;
        font-size: 17px;
        line-height: 1;
        cursor: pointer;
      }
      #play:hover,
      #mute:hover {
        border-color: #63dfff;
        color: #63dfff;
      }
      #mute {
        width: 38px;
        height: 38px;
        flex: 0 0 38px;
        border: 1px solid #38445c;
        border-radius: 50%;
        background: #141a26;
        color: #c9d8ee;
        font-size: 16px;
        line-height: 1;
        cursor: pointer;
      }
      #scrub {
        flex: 1;
        accent-color: #63dfff;
        cursor: pointer;
      }
      #time {
        flex: 0 0 auto;
        font-variant-numeric: tabular-nums;
        color: #9fb0c8;
        font-size: 14px;
      }
      #blockname {
        flex: 0 0 300px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        text-align: right;
        color: #c9d8ee;
        font-size: 14px;
      }
      body.render #hud {
        display: none;
      }
      body.render #stage {
        height: 100vh;
      }
      body.render #canvas-host {
        width: 100vw;
        height: 100vh;
      }
      body.render #canvas-host canvas {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="stage"><div id="canvas-host"></div></div>
    <div id="hud">
      <button id="play" type="button" aria-label="播放/暂停">▶</button>
      <button id="mute" type="button" aria-label="静音">♪</button>
      <input id="scrub" type="range" min="0" max="137" step="0.01" value="0" />
      <span id="time">0:00.0 / 2:17.0</span>
      <span id="blockname">序幕 · Intro</span>
    </div>
    <script src="/vendor/p5.min.js"></script>
    <script type="module" src="/src/main/index.js"></script>
  </body>
</html>
